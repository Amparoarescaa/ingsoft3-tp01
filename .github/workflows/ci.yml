name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-backend:
    name: Build y tests backend
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Construir imagen del backend
        uses: docker/build-push-action@v7
        with:
          context: ./petstyle/backend
          push: false
          tags: backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Preparar Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: petstyle/backend/package-lock.json

      - name: Instalar dependencias
        working-directory: ./petstyle/backend
        run: npm ci

      - name: Tests unitarios y coverage
        working-directory: ./petstyle/backend
        run: npx vitest run --coverage

      - name: Mostrar coverage
        if: always()
        working-directory: ./petstyle/backend
        run: |
          echo "## Coverage Backend" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"

          if [ -f coverage/coverage-summary.json ]; then
            node -e "const c=require('./coverage/coverage-summary.json').total; console.log('Lines: ' + c.lines.pct + '%'); console.log('Branches: ' + c.branches.pct + '%'); console.log('Functions: ' + c.functions.pct + '%'); console.log('Statements: ' + c.statements.pct + '%')" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No se generó el reporte de cobertura." >> "$GITHUB_STEP_SUMMARY"
          fi

          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar coverage
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-backend
          path: petstyle/backend/coverage/
          if-no-files-found: ignore

      - name: Login en GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagen backend con SHA
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: ./petstyle/backend
          push: true
          tags: ghcr.io/amparoarescaa/petstyle-backend:sha-${{ github.sha }}

  build-frontend:
    name: Build y tests frontend
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Construir imagen del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./petstyle/frontend
          push: false
          tags: frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Preparar Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: petstyle/frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: ./petstyle/frontend
        run: npm ci

      - name: Tests unitarios y coverage
        working-directory: ./petstyle/frontend
        run: npx vitest run --coverage

      - name: Mostrar coverage
        if: always()
        working-directory: ./petstyle/frontend
        run: |
          echo "## Coverage Frontend" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"

          if [ -f coverage/coverage-summary.json ]; then
            node -e "const c=require('./coverage/coverage-summary.json').total; console.log('Lines: ' + c.lines.pct + '%'); console.log('Branches: ' + c.branches.pct + '%'); console.log('Functions: ' + c.functions.pct + '%'); console.log('Statements: ' + c.statements.pct + '%')" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No se generó el reporte de cobertura." >> "$GITHUB_STEP_SUMMARY"
          fi

          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar coverage
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-frontend
          path: petstyle/frontend/coverage/
          if-no-files-found: ignore

      - name: Login en GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagen frontend con SHA
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: ./petstyle/frontend
          push: true
          tags: ghcr.io/amparoarescaa/petstyle-frontend:sha-${{ github.sha }}
          build-args: |
            VITE_SENTRY_DSN=${{ vars.VITE_SENTRY_DSN }}

  deploy-qa:
    name: Deploy QA
    needs: [build-backend, build-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: qa

    steps:
      - name: Desplegar imágenes SHA en Render QA
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          desplegar() {
            local nombre="$1"
            local servicio="$2"
            local imagen="$3"

            echo "Desplegando $nombre"
            echo "Imagen: $imagen"

            respuesta=$(curl --fail --silent --show-error \
              --retry 3 \
              --connect-timeout 15 \
              --max-time 60 \
              -X POST \
              "https://api.render.com/v1/services/$servicio/deploys" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Content-Type: application/json" \
              --data "$(jq -nc --arg image "$imagen" '{imageUrl: $image}')")

            deploy_id=$(echo "$respuesta" | jq -r '.id')

            if [ -z "$deploy_id" ] || [ "$deploy_id" = "null" ]; then
              echo "ERROR: Render no devolvió un ID de despliegue"
              exit 1
            fi

            echo "Deploy ID: $deploy_id"

            for intento in $(seq 1 60); do
              respuesta=$(curl --fail --silent --show-error \
                --connect-timeout 15 \
                --max-time 60 \
                "https://api.render.com/v1/services/$servicio/deploys/$deploy_id" \
                -H "Authorization: Bearer $RENDER_API_KEY")

              estado=$(echo "$respuesta" | jq -r '.status')
              referencia=$(echo "$respuesta" | jq -r '.image.ref // empty')

              echo "$nombre - intento $intento - estado: $estado"

              if [ "$estado" = "live" ]; then
                if [ "$referencia" != "$imagen" ]; then
                  echo "ERROR: La imagen desplegada no coincide con el SHA esperado."
                  echo "Esperada: $imagen"
                  echo "Obtenida: $referencia"
                  exit 1
                fi

                echo "OK: $nombre desplegado con la imagen correcta"
                return 0
              fi

              case "$estado" in
                build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                  echo "ERROR: Falló el despliegue de $nombre"
                  exit 1
                  ;;
              esac

              sleep 15
            done

            echo "ERROR: Timeout esperando el despliegue de $nombre"
            exit 1
          }

          desplegar \
            "Backend QA" \
            "srv-db4kmdrncjis73ft6ghg" \
            "ghcr.io/amparoarescaa/petstyle-backend:sha-$COMMIT_SHA"

          desplegar \
            "Frontend QA" \
            "srv-db4meaks728c73fsae20" \
            "ghcr.io/amparoarescaa/petstyle-frontend:sha-$COMMIT_SHA"

      - name: Smoke tests QA
        run: |
          set -euo pipefail

          verificar() {
            local nombre="$1"
            local url="$2"

            for intento in $(seq 1 30); do
              if curl --fail --silent --show-error \
                --connect-timeout 10 \
                --max-time 60 \
                "$url" > /dev/null; then

                echo "OK: $nombre"
                return 0
              fi

              echo "Esperando $nombre ($intento/30)"
              sleep 15
            done

            echo "ERROR: $nombre no responde"
            return 1
          }

          verificar \
            "Backend QA" \
            "https://petstyle-backend-qa.onrender.com/health"

          verificar \
            "Productos QA" \
            "https://petstyle-backend-qa.onrender.com/api/productos"

          verificar \
            "Frontend QA" \
            "https://petstyle-frontend-qa.onrender.com/"

  integration-tests:
    name: Tests de integración Playwright QA
    needs: deploy-qa
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: qa

    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Preparar Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: petstyle/frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: ./petstyle/frontend
        run: npm ci

      - name: Ejecutar tests de integración contra QA
        working-directory: ./petstyle/frontend
        env:
          QA_TEST_TOKEN: ${{ secrets.QA_TEST_TOKEN }}
        run: npx playwright test e2e/api.spec.js

      - name: Publicar reporte de integración
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-integration-report
          path: |
            petstyle/frontend/playwright-report/
            petstyle/frontend/playwright-results/
          if-no-files-found: ignore

  e2e-tests:
    name: Tests E2E Playwright QA
    needs: integration-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: qa

    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Preparar Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: petstyle/frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: ./petstyle/frontend
        run: npm ci

      - name: Instalar Chromium
        working-directory: ./petstyle/frontend
        run: npx playwright install --with-deps chromium

      - name: Ejecutar los 3 tests E2E
        working-directory: ./petstyle/frontend
        run: npx playwright test e2e/petstyle.spec.js

      - name: Publicar reporte HTML de Playwright
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-html
          path: petstyle/frontend/playwright-report/
          if-no-files-found: ignore

      - name: Publicar reporte JUnit de Playwright
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-junit
          path: petstyle/frontend/playwright-results/
          if-no-files-found: ignore

  deploy-prod:
    name: Deploy Producción
    needs: [integration-tests, e2e-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Desplegar imágenes SHA en Render PROD
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          desplegar() {
            local nombre="$1"
            local servicio="$2"
            local imagen="$3"

            echo "Desplegando $nombre"
            echo "Imagen: $imagen"

            respuesta=$(curl --fail --silent --show-error \
              --retry 3 \
              --connect-timeout 15 \
              --max-time 60 \
              -X POST \
              "https://api.render.com/v1/services/$servicio/deploys" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Content-Type: application/json" \
              --data "$(jq -nc --arg image "$imagen" '{imageUrl: $image}')")

            deploy_id=$(echo "$respuesta" | jq -r '.id')

            if [ -z "$deploy_id" ] || [ "$deploy_id" = "null" ]; then
              echo "ERROR: Render no devolvió un ID de despliegue"
              exit 1
            fi

            echo "Deploy ID: $deploy_id"

            for intento in $(seq 1 60); do
              respuesta=$(curl --fail --silent --show-error \
                --connect-timeout 15 \
                --max-time 60 \
                "https://api.render.com/v1/services/$servicio/deploys/$deploy_id" \
                -H "Authorization: Bearer $RENDER_API_KEY")

              estado=$(echo "$respuesta" | jq -r '.status')
              referencia=$(echo "$respuesta" | jq -r '.image.ref // empty')

              echo "$nombre - intento $intento - estado: $estado"

              if [ "$estado" = "live" ]; then
                if [ "$referencia" != "$imagen" ]; then
                  echo "ERROR: La imagen desplegada no coincide con el SHA esperado."
                  exit 1
                fi

                echo "OK: $nombre desplegado correctamente"
                return 0
              fi

              case "$estado" in
                build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                  echo "ERROR: Falló el despliegue de $nombre"
                  exit 1
                  ;;
              esac

              sleep 15
            done

            echo "ERROR: Timeout esperando el despliegue de $nombre"
            exit 1
          }

          desplegar \
            "Backend PROD" \
            "srv-db4l7ead0e5s73cpkdj0" \
            "ghcr.io/amparoarescaa/petstyle-backend:sha-$COMMIT_SHA"

          desplegar \
            "Frontend PROD" \
            "srv-db4mi0u7bikc73fdqusg" \
            "ghcr.io/amparoarescaa/petstyle-frontend:sha-$COMMIT_SHA"

      - name: Smoke tests producción
        run: |
          set -euo pipefail

          verificar() {
            local nombre="$1"
            local url="$2"

            for intento in $(seq 1 30); do
              if curl --fail --silent --show-error \
                --connect-timeout 10 \
                --max-time 60 \
                "$url" > /dev/null; then

                echo "OK: $nombre"
                return 0
              fi

              echo "Esperando $nombre ($intento/30)"
              sleep 15
            done

            echo "ERROR: $nombre no responde"
            return 1
          }

          verificar \
            "Backend PROD" \
            "https://petstyle-backend-prod.onrender.com/health"

          verificar \
            "Productos PROD" \
            "https://petstyle-backend-prod.onrender.com/api/productos"

          verificar \
            "Frontend PROD" \
            "https://petstyle-frontend-prod.onrender.com/"