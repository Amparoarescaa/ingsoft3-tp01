name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la imagen del backend
        uses: docker/build-push-action@v7
        with:
          context: ./petstyle/backend
          push: false
          tags: backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Preparar Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: petstyle/backend/package-lock.json

      - name: Instalar dependencias del backend
        working-directory: ./petstyle/backend
        run: npm ci

      - name: Ejecutar tests y coverage del backend
        working-directory: ./petstyle/backend
        run: npx vitest run --coverage

      - name: Mostrar coverage del backend en el Summary
        if: always()
        working-directory: ./petstyle/backend
        run: |
          echo "## Coverage Backend" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          node -e "const c=require('./coverage/coverage-summary.json').total; console.log('Lines: ' + c.lines.pct + '%'); console.log('Branches: ' + c.branches.pct + '%'); console.log('Functions: ' + c.functions.pct + '%'); console.log('Statements: ' + c.statements.pct + '%')" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Subir reporte de coverage del backend
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-backend
          path: petstyle/backend/coverage/

      - name: Login en GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagen del backend
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: ./petstyle/backend
          push: true
          tags: ghcr.io/amparoarescaa/petstyle-backend:sha-${{ github.sha }}

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la imagen del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./petstyle/frontend
          push: false
          tags: frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Preparar Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: petstyle/frontend/package-lock.json

      - name: Instalar dependencias del frontend
        working-directory: ./petstyle/frontend
        run: npm ci

      - name: Ejecutar tests y coverage del frontend
        working-directory: ./petstyle/frontend
        run: npx vitest run --coverage

      - name: Mostrar coverage del frontend en el Summary
        if: always()
        working-directory: ./petstyle/frontend
        run: |
          echo "## Coverage Frontend" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          node -e "const c=require('./coverage/coverage-summary.json').total; console.log('Lines: ' + c.lines.pct + '%'); console.log('Branches: ' + c.branches.pct + '%'); console.log('Functions: ' + c.functions.pct + '%'); console.log('Statements: ' + c.statements.pct + '%')" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Subir reporte de coverage del frontend
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-frontend
          path: petstyle/frontend/coverage/

      - name: Login en GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagen del frontend
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: ./petstyle/frontend
          push: true
          tags: ghcr.io/amparoarescaa/petstyle-frontend:sha-${{ github.sha }}

  deploy-qa:
    name: Deploy QA
    needs: [build-backend, build-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: qa

    steps:
      - name: Desplegar backend en QA
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_HOOK_API_QA }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          curl --fail --silent --show-error \
            --retry 3 \
            --connect-timeout 15 \
            --max-time 60 \
            "${DEPLOY_HOOK}&ref=${COMMIT_SHA}"

      - name: Desplegar frontend en QA
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_HOOK_FRONT_QA }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          curl --fail --silent --show-error \
            --retry 3 \
            --connect-timeout 15 \
            --max-time 60 \
            "${DEPLOY_HOOK}&ref=${COMMIT_SHA}"

      - name: Smoke tests de QA
        env:
          API_URL: https://petstyle-backend-qa.onrender.com
          FRONT_URL: https://petstyle-frontend-qa.onrender.com
        run: |
          verificar() {
            local nombre="$1"
            local url="$2"

            echo "Verificando $nombre: $url"

            for intento in $(seq 1 30); do
              if curl --fail --silent --show-error \
                --connect-timeout 10 \
                --max-time 60 \
                "$url" > /dev/null; then
                echo "OK: $nombre"
                return 0
              fi

              echo "Intento $intento/30 fallido. Reintentando en 15 segundos..."
              sleep 15
            done

            echo "ERROR: $nombre no respondió correctamente"
            return 1
          }

          verificar "Health backend QA" "$API_URL/health"
          echo "Verificando productos de QA..."

          productos_ok=false

          for intento in $(seq 1 30); do
            respuesta=$(curl --fail --silent \
              --connect-timeout 10 \
              --max-time 60 \
              "$API_URL/api/productos") || respuesta=""

            if echo "$respuesta" | grep -q '"nombre"'; then
              echo "OK: PostgreSQL devolvió productos"
              productos_ok=true
              break
            fi

            echo "Productos no disponibles. Reintentando en 15 segundos..."
            sleep 15
          done

          if [ "$productos_ok" != "true" ]; then
            echo "ERROR: QA no pudo consultar productos en PostgreSQL"
            exit 1
          fi
          verificar "Frontend QA" "$FRONT_URL/"

  deploy-prod:
    name: Deploy Producción
    needs: deploy-qa
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Desplegar backend en producción
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_HOOK_API_PROD }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          curl --fail --silent --show-error \
            --retry 3 \
            --connect-timeout 15 \
            --max-time 60 \
            "${DEPLOY_HOOK}&ref=${COMMIT_SHA}"

      - name: Desplegar frontend en producción
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_HOOK_FRONT_PROD }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          curl --fail --silent --show-error \
            --retry 3 \
            --connect-timeout 15 \
            --max-time 60 \
            "${DEPLOY_HOOK}&ref=${COMMIT_SHA}"

      - name: Smoke tests de producción
        env:
          API_URL: https://petstyle-backend-prod.onrender.com
          FRONT_URL: https://petstyle-frontend-prod.onrender.com
        run: |
          verificar() {
            local nombre="$1"
            local url="$2"

            echo "Verificando $nombre: $url"

            for intento in $(seq 1 30); do
              if curl --fail --silent --show-error \
                --connect-timeout 10 \
                --max-time 60 \
                "$url" > /dev/null; then
                echo "OK: $nombre"
                return 0
              fi

              echo "Intento $intento/30 fallido. Reintentando en 15 segundos..."
              sleep 15
            done

            echo "ERROR: $nombre no respondió correctamente"
            return 1
          }

          verificar "Health backend PROD" "$API_URL/health"
          echo "Verificando productos de producción..."

          productos_ok=false

          for intento in $(seq 1 30); do
            respuesta=$(curl --fail --silent \
              --connect-timeout 10 \
              --max-time 60 \
              "$API_URL/api/productos") || respuesta=""

            if echo "$respuesta" | grep -q '"nombre"'; then
              echo "OK: PostgreSQL devolvió productos"
              productos_ok=true
              break
            fi

            echo "Productos no disponibles. Reintentando en 15 segundos..."
            sleep 15
          done

          if [ "$productos_ok" != "true" ]; then
            echo "ERROR: PROD no pudo consultar productos en PostgreSQL"
            exit 1
          fi
          verificar "Frontend PROD" "$FRONT_URL/"